name: Formal

# ci.yml calls this workflow for every pull request, so the PR model job is
# part of ci-gate. The nightly job runs only from this workflow's own triggers.
on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tla-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether a mapped file changed
        id: changed
        # specs/tla/mapping.json lists the files that each model covers.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if node scripts/formal/changed.mjs "$base"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.changed.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        if: steps.changed.outputs.run == 'true'
        with:
          path: target/formal
          key: tla-${{ runner.os }}-1.8.0-mirror-df7cef5d
      - name: TLA+ PR model and mutations
        if: steps.changed.outputs.run == 'true'
        run: scripts/formal/check.sh

  tla-nightly:
    if: github.workflow == 'Formal' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: target/formal
          key: tla-${{ runner.os }}-1.8.0-mirror-df7cef5d
      - name: TLA+ nightly model
        run: scripts/formal/check.sh nightly


  # Verus pilot: the flat planner checker and the Hall counting theorem.
  # D-074: no fixed time cap. Observed locally: about 1 second of proof time.
  verus-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether a proof or crate file changed
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^crates/swap-plan-check/|^\.github/workflows/formal\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@1.100.0
        if: steps.changed.outputs.run == 'true'
      - name: Install pinned Verus
        if: steps.changed.outputs.run == 'true'
        run: |
          curl -fsSL -o verus.zip \
            https://github.com/verus-lang/verus/releases/download/release/0.2026.11.22.1ce6a59/verus-0.2026.11.22.1ce6a59-x86-linux.zip
          echo "c955d5958877f4f907cce80aa996d4239a481984829d82e325938c7bf242b0db  verus.zip" | sha256sum -c -
          unzip -q verus.zip
          echo "$PWD/verus-x86-linux" >> "$GITHUB_PATH"
      - name: Rust tests for the proof crate
        if: steps.changed.outputs.run == 'true'
        run: cargo test -p swap-plan-check
      - name: Verus proof
        if: steps.changed.outputs.run == 'true'
        run: verus --no-cheating --triggers-mode silent --time crates/swap-plan-check/verus/flat_plan_check.rs
      - name: Conformance against the Rust round checker
        if: steps.changed.outputs.run == 'true'
        env:
          VERUS: verus
        run: crates/swap-plan-check/verus/conformance.sh
      - name: Four proof mutations
        if: steps.changed.outputs.run == 'true'
        env:
          VERUS: verus
        run: crates/swap-plan-check/verus/mutations.sh
      - name: Four Rust mutations
        if: steps.changed.outputs.run == 'true'
        run: crates/swap-plan-check/mutations/run.sh

  verus-nightly:
    if: github.workflow == 'Formal' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Install pinned Verus
        run: |
          curl -fsSL -o verus.zip \
            https://github.com/verus-lang/verus/releases/download/release/0.2026.11.22.1ce6a59/verus-0.2026.11.22.1ce6a59-x86-linux.zip
          echo "c955d5958877f4f907cce80aa996d4239a481984829d82e325938c7bf242b0db  verus.zip" | sha256sum -c -
          unzip -q verus.zip
          echo "$PWD/verus-x86-linux" >> "$GITHUB_PATH"
      - name: Rust tests for the proof crate
        run: cargo test -p swap-plan-check
      - name: Verus proof
        run: verus --no-cheating --triggers-mode silent --time crates/swap-plan-check/verus/flat_plan_check.rs
      - name: Conformance against the Rust round checker
        env:
          VERUS: verus
        run: crates/swap-plan-check/verus/conformance.sh
      - name: Four proof mutations
        env:
          VERUS: verus
        run: crates/swap-plan-check/verus/mutations.sh
      - name: Four Rust mutations
        run: crates/swap-plan-check/mutations/run.sh
