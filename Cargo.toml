[workspace]
members = ["crates/swap-core", "crates/swap-db", "crates/swap-files", "crates/swap-discord", "crates/swap-engine", "crates/swap-sim", "crates/swap-acceptance", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["Patrik Weibull"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
