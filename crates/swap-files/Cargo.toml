[package]
name = "swap-files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "File policy, hashing, and content store for Monsquaz Swap"

[dependencies]
hex = "0.4"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
wait-timeout = "0.2"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
proptest = "1"
