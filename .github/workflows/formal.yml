name: Formal

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tla-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether a modeled file changed
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(specs/tla/|scripts/formal/|crates/swap-core/src/(ledger|state)\.rs|crates/swap-core/tests/assignment_machine\.rs)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.changed.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        if: steps.changed.outputs.run == 'true'
        with:
          path: target/formal
          key: tla-${{ runner.os }}-1.8.0-2026-11-26
      - name: TLA+ PR model and mutations
        if: steps.changed.outputs.run == 'true'
        run: scripts/formal/check.sh

  tla-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: target/formal
          key: tla-${{ runner.os }}-1.8.0-2026-11-26
      - name: TLA+ nightly model
        run: scripts/formal/check.sh nightly

