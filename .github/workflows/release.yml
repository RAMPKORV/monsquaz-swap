name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate tag and version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag must look like vX.Y.Z: $TAG"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json $APP_VERSION"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG is not on main"
            exit 1
          fi
          PRERELEASE=false
          case "$TAG" in *-*) PRERELEASE=true ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Create or reuse draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          STATE="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          if [ "$STATE" = "false" ]; then
            echo "::error::Release $TAG is already published"
            exit 1
          fi
          if [ "$STATE" = "true" ]; then
            RELEASE_ID="$(gh release view "$TAG" --json databaseId -q .databaseId)"
          else
            ARGS=(--draft --verify-tag --title "$TAG" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
            gh release create "$TAG" "${ARGS[@]}"
            RELEASE_ID="$(gh release view "$TAG" --json databaseId -q .databaseId)"
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  verify:
    name: E2E gate
    needs: prepare
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  build-windows:
    name: Windows x64 (NSIS)
    needs: [prepare, verify]
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ci-rust-windows
          save-if: false
          cache-on-failure: false
      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          uploadUpdaterJson: false
          retryAttempts: 3
          tauriScript: pnpm tauri
          args: --bundles nsis
      - name: Attest installer
        uses: actions/attest@v4
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe

  build-linux:
    name: Linux x64 (deb + AppImage)
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils tar file zstd zip unzip \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            libfuse2 \
            xdg-utils
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ci-rust-linux
          save-if: false
          cache-on-failure: false
      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          uploadUpdaterJson: false
          retryAttempts: 3
          tauriScript: pnpm tauri
          args: --bundles deb,appimage
      - name: Attest installers
        uses: actions/attest@v4
        with:
          subject-path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  finalize:
    name: Checksums and notices
    needs: [prepare, build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern '*.exe' --pattern '*.deb' --pattern '*.AppImage'
      - name: Create checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.exe *.deb *.AppImage | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Copy notices
        run: |
          cp LICENSE dist/
          if [ -f THIRD_PARTY_LICENSES.md ]; then cp THIRD_PARTY_LICENSES.md dist/; fi
      - name: Upload metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          FILES=(dist/SHA256SUMS dist/LICENSE)
          if [ -f dist/THIRD_PARTY_LICENSES.md ]; then FILES+=(dist/THIRD_PARTY_LICENSES.md); fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

  publish:
    name: Publish release
    needs: [prepare, finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=true -f make_latest=false
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=false -f make_latest=true
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
