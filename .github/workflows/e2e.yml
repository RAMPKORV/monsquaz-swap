name: E2E

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test. Empty uses the caller ref."
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            build-essential \
            openmpt123
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui exec playwright install --with-deps chromium
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ci-e2e
          cache-on-failure: true
      - name: Build the UI and the bridge
        run: |
          pnpm --dir ui build
          cargo build -p swap-e2e --features bridge --bin e2e-bridge
      - name: Rust and simulator journeys
        run: cargo test -p swap-e2e
      - name: Browser journeys
        env:
          MSW_E2E_BRIDGE_BIN: ${{ github.workspace }}/target/debug/e2e-bridge
        run: pnpm --dir ui e2e
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            target/e2e
          if-no-files-found: warn
