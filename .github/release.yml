changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [feat, feature, enhancement]
    - title: Fixes
      labels: [fix, bug]
    - title: Performance
      labels: [perf, performance]
    - title: Documentation
      labels: [docs]
    - title: Maintenance
      labels: [chore, ci, build, refactor, test, dependencies]
    - title: Other changes
      labels: ["*"]
