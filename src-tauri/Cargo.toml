[package]
name = "monsquaz-swap"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Anonymous Discord music-swap host and bot"

[lib]
# The `_lib` suffix avoids a Windows name collision with the binary.
name = "monsquaz_swap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swap-core = { path = "../crates/swap-core" }
swap-db = { path = "../crates/swap-db" }
swap-engine = { path = "../crates/swap-engine" }
swap-files = { path = "../crates/swap-files" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
