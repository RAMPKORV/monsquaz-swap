[package]
name = "swap-discord"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Discord adapter contract for Monsquaz Swap"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
twilight-gateway = { version = "0.18", optional = true, default-features = false, features = ["rustls-platform-verifier", "zstd"] }
twilight-http = { version = "0.18", optional = true, default-features = false, features = ["rustls-platform-verifier"] }
twilight-model = { version = "0.18", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }
serde_json = { version = "1", optional = true }

[features]
default = ["live"]
live = [
    "dep:twilight-gateway",
    "dep:twilight-http",
    "dep:twilight-model",
    "dep:serde_json",
    "dep:reqwest",
]
test-proxy = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
proptest = "1"
wiremock = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[[example]]
name = "gateway_smoke"
required-features = ["live"]
